# Host-side tooling only; the firmware is C.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "BLE", "SLF"]

[lint.per-file-ignores]
# Tests reach into the client's private serial handle to inject a fake device.
"tools/tests/*" = ["SLF001"]
